<!doctype html>

  <meta charset="UTF-8" />
  <!-- کُشندهٔ service workerِ کهنه + fallbackِ عکسِ خراب -->
  <script>
    (function () {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations()
            .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
            .catch(function () {});
        }
        if (window.caches && caches.keys) {
          caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
        }
      } catch (e) {}
    })();
    // اگر عکسی (آواتار/آیکون) لود نشد، به‌جای عکسِ خراب یک placeholderِ خنثی نشان بده تا UI خراب دیده نشود.
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      if (t && t.tagName === 'IMG' && !t.dataset.fb) {
        t.dataset.fb = '1';
        t.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" rx="40" fill="%23e5e1f0"/><circle cx="40" cy="31" r="14" fill="%23b9b0d4"/><rect x="15" y="51" width="50" height="28" rx="14" fill="%23b9b0d4"/></svg>';
      }
    }, true);
  </script>

  <!-- interactive-widget حذف شد → رفتارِ پیش‌فرضِ overlay: layout ثابت می‌ماند و فقط visualViewport

       «کیبورد روی ورودی می‌افتد» — یک فرمول، همه‌جا). -->
